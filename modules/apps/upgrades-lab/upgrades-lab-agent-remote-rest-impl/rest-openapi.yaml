components:
    schemas:
        UpgradeRun:
            description:
                One upgrade run as the runner knows it. The result branch and the pull request URL stay empty until the run reaches publishing.
            properties:
                branch:
                    description:
                        The branch of the repository to upgrade.
                    type: string
                credentialKeyReference:
                    description:
                        The key reference of the private key the runner reaches the repository with. Leave it out when the repository needs no credential.
                    type: string
                customerName:
                    description:
                        The short customer identifier the agent names reports and artifacts with.
                    type: string
                dbTargetType:
                    description:
                        The database type the upgraded workspace runs against, such as mysql or postgresql.
                    type: string
                dbTargetVersion:
                    description:
                        The database version the upgraded workspace runs against, such as 8.0.
                    type: string
                externalReferenceCode:
                    description:
                        The identifier the runner knows the run by. Read only.
                    readOnly: true
                    type: string
                nodeVersion:
                    description:
                        The concrete Node.js patch version for the upgraded workspace, such as 20.18.0. The agent feeds it into a Docker image tag verbatim, so a range does not resolve.
                    type: string
                pullRequestURL:
                    description:
                        The pull request the run published its result to. Read only.
                    readOnly: true
                    type: string
                repositoryURL:
                    description:
                        The URL of the repository to upgrade. An SSH URL needs a credential key reference. An HTTPS or file URL of a repository Git can reach anonymously needs none.
                    type: string
                resultBranch:
                    description:
                        The branch the run pushed its result to. Read only.
                    readOnly: true
                    type: string
                searchVersion:
                    description:
                        The concrete search engine version for the upgraded workspace, such as 8.17.4. The agent feeds it into a Docker image tag verbatim, so a range does not resolve.
                    type: string
                status:
                    description:
                        The status the run is in. Read only.
                    enum:
                        -   blocked
                        -   cancelled
                        -   cloning
                        -   failed
                        -   provisioning
                        -   publishing
                        -   queued
                        -   running
                        -   successful
                        -   timed-out
                        -   validating
                    readOnly: true
                    type: string
                statusMessage:
                    description:
                        What the run was doing when it last reported. Read only.
                    readOnly: true
                    type: string
                targetRelease:
                    description:
                        The release to upgrade the repository to.
                    type: string
                upgradeRunId:
                    description:
                        The primary key of the run the portal stores.
                    format: int64
                    type: integer
                upgradeSourceVersion:
                    description:
                        The Liferay version the repository currently targets, such as 7.4.13-u92.
                    type: string
                upgradeTargetJavaVersion:
                    description:
                        The Java version the upgraded workspace builds with, such as 21.
                    type: string
                workspacePath:
                    description:
                        The directory on the runner host where the run cloned and upgraded the repository. Read only.
                    readOnly: true
                    type: string
            required:
                -   branch
                -   customerName
                -   dbTargetType
                -   dbTargetVersion
                -   nodeVersion
                -   repositoryURL
                -   searchVersion
                -   targetRelease
                -   upgradeSourceVersion
                -   upgradeTargetJavaVersion
info:
    description:
        "Submits, polls, and cancels upgrade runs on the configured upgrade runner. A Java client JAR is available for use with the group ID 'com.liferay', artifact ID 'com.liferay.upgrades.lab.agent.remote.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Upgrades Lab Agent Remote
    version: v1.0
openapi: 3.0.1
paths:
    "/upgrade-runs":
        post:
            description:
                Submits an upgrade run to the runner and returns the run it created.
            operationId: postUpgradeRun
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpgradeRun"
                    application/xml:
                        schema:
                            $ref: "#/components/schemas/UpgradeRun"
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UpgradeRun"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/UpgradeRun"
                    description:
                        The submitted run.
            tags: ["UpgradeRun"]
    "/upgrade-runs/by-external-reference-code/{externalReferenceCode}":
        delete:
            description:
                Cancels the run and releases whatever the substrate allocated for it. Cancelling a run that already finished does nothing.
            operationId: deleteUpgradeRunByExternalReferenceCode
            parameters:
                -   in: path
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
            responses:
                204:
                    content:
                        application/json: {}
                        application/xml: {}
                    description:
                        The run was cancelled.
            tags: ["UpgradeRun"]
        get:
            description:
                Returns the runner's view of the run at this moment.
            operationId: getUpgradeRunByExternalReferenceCode
            parameters:
                -   in: path
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UpgradeRun"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/UpgradeRun"
                    description:
                        The run.
            tags: ["UpgradeRun"]